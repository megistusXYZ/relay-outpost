name: CI

on:
  # No paths-ignore: build-and-test is a REQUIRED check on the protected main
  # branch, and a PR whose changed paths were all ignored would never receive
  # the check and could not merge. CI on a docs-only PR is cheap; a stuck PR
  # is not.
  push:
    branches: [main, local-dev]
  pull_request:
    branches: [main, local-dev]

# When a branch or PR is pushed again before its run finishes, cancel the
# now-stale run. Only ever cancels superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 because that is what SHIPS — Dockerfile is `FROM node:20-slim`.
      # Keep this pinned to production, not to whatever devs run locally.
      #
      # The gap bites: a laptop on Node 22+ has globals Node 20 lacks
      # (WebSocket, sessionStorage), so a test can lean on one, pass locally,
      # and fail only here. That kept this workflow red for 20 consecutive runs
      # while everyone read a green local run and merged anyway. `.nvmrc` now
      # pins local to 20 too, and `npm run test:ci-globals` reproduces the
      # missing-global class on a newer Node without needing to switch versions.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Replit's publish flow regenerates package-lock.json against its internal
      # package proxy (package-firewall.replit.local), baking that host into the
      # `resolved` URLs. GitHub runners can't reach it, so installs fail there.
      # Rewrite those back to the public registry before installing. Idempotent —
      # a no-op when the lockfile is already clean. (integrity hashes are
      # content-based, so the rewritten URLs still validate.)
      - name: Normalize lockfile registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      # Use `npm install` (not `npm ci`): the lockfile omits an optional native
      # transitive dep (bufferutil, via ws) that the Linux runner resolves into its
      # ideal tree, which makes strict `npm ci` fail. `npm install` matches how the
      # app is actually installed (Replit/local). Switch back to `npm ci` once the
      # lockfile is regenerated on Linux so it's fully in sync.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Gating steps — these must pass.
      - name: Test
        run: npm test

      # Cheap belt-and-braces (~5s): the same suite with the newer-Node globals
      # stripped. Redundant while this job pins Node 20 — that is the point. It
      # fails loudly the day someone bumps node-version or .nvmrc without
      # noticing a test had started leaning on a global production won't have.
      - name: Test (production globals only)
        if: always()
        run: npm run test:ci-globals

      # `if: always()` on every gate after the first: a failing step otherwise
      # SKIPS the rest, so one broken test file quietly disabled Build and
      # Type-check for two weeks — 34 of 34 red runs reported one gate out of
      # three. Report all of them; a run that stops at the first problem hides
      # how many there are.
      - name: Build
        if: always()
        run: npm run build

      # Zero type errors, and any new one fails CI. (A baseline count used to
      # sit here; set above the real count, it let new errors land unnoticed.)
      - name: Type-check (none allowed)
        if: always()
        # tsc's own exit status, not a count of "error TS" lines: a tsc that
        # crashes (out of memory exits 134) prints no errors at all, and a
        # count read that as clean. Proven locally 2026-10-07: clean 0, one
        # error 2, out of memory 134 with zero "error TS" lines.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run check
