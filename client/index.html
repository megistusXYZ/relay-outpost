    <!-- ── Cold-start branded splash ──────────────────────────────────────────
         Inline, dependency-free critical CSS so the Relay Outpost mark paints
         the instant the HTML loads — before the JS bundle parses / React mounts.
         No blank screen on cold start (browser tab OR installed PWA, mobile &
         desktop). Theme-matched bg is set by the script below to avoid a flash;
         main.tsx fades + removes #ro-splash once the app is mounted. -->
    <style>
      #ro-splash{
        position:fixed;
        inset:0;
        z-index:2147483647;
        display:flex;
        align-items:center;
        justify-content:center;
        /* Default to the brand dark canvas; the inline script below overrides
           to the light or black canvas before paint. */
        background:#0a0a0a;
        --ro-mark:#ffffff;
        --ro-glow:rgba(139,92,246,.42);
        --ro-glow2:rgba(99,102,241,.34);
        --ro-ring:rgba(139,92,246,.38);
        --ro-dot:rgba(255,255,255,.14);
        --ro-dot-on:#a78bfa;
        --ro-trace:#c4b5fd;
        --ro-note:rgba(255,255,255,.42);
        transition:opacity .22s ease;
        opacity:1;
      }
      html.ro-splash-light #ro-splash{
        background:#f8f7fc;
        --ro-mark:#7c3aed;
        --ro-glow:rgba(124,58,237,.22);
        --ro-glow2:rgba(99,102,241,.16);
        --ro-ring:rgba(124,58,237,.28);
        --ro-dot:rgba(124,58,237,.16);
        --ro-dot-on:#7c3aed;
        --ro-trace:#ffffff;
        --ro-note:rgba(60,50,90,.5);
      }
      html.ro-splash-black #ro-splash{background:#050408;}
      #ro-splash.ro-splash-hide{opacity:0;pointer-events:none;}
      /* The page itself wears the splash's colour while booting, so no
         browser-white ever shows before the splash or the app paints. Removed
         with the splash, so the app's own theme styles take over after. */
      html.ro-booting,html.ro-booting body{background:#0a0a0a;margin:0}
      html.ro-booting.ro-splash-light,html.ro-booting.ro-splash-light body{background:#f8f7fc}
      html.ro-booting.ro-splash-black,html.ro-booting.ro-splash-black body{background:#050408}
      /* First frame = the iOS launch image (client/public/splash/*.png): the
         same 54px mark on the same 132px glow, still. So the hand-off from the
         launch image can't be seen. Everything moves only once there's a real
         wait (.ro-splash-waiting, 400 ms) — a fast launch never sees a beat. */
      .ro-splash-stage{
        position:relative;
        width:132px;
        height:132px;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      .ro-splash-glow{
        position:absolute;
        inset:0;
        border-radius:50%;
        background:radial-gradient(circle at center, var(--ro-glow) 0%, transparent 70%);
        filter:blur(8px);
      }
      .ro-splash-glow-2{
        background:radial-gradient(circle at center, var(--ro-glow2) 0%, transparent 62%);
        opacity:0;
      }
      .ro-splash-waiting .ro-splash-glow{animation:roSplashGlow 2.9s ease-in-out infinite;}
      .ro-splash-waiting .ro-splash-glow-2{animation:roSplashGlow2 3.7s ease-in-out infinite;}
      .ro-splash-mark{
        position:relative;
        width:54px;
        height:54px;
        color:var(--ro-mark);
        overflow:visible;
      }
      /* A light traces the loop of the mark while the app loads. */
      .ro-splash-trace{fill:none;stroke:var(--ro-trace);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s ease;}
      .ro-splash-waiting .ro-splash-trace{opacity:1;animation:roSplashTrace 1.15s cubic-bezier(.45,0,.25,1) infinite;}
      .ro-splash-stuck .ro-splash-trace{opacity:0;animation:none;}
      @keyframes roSplashTrace{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
      @keyframes roSplashGlow{
        0%,100%{opacity:1;transform:scale(1);}
        50%{opacity:.7;transform:scale(1.08);}
      }
      @keyframes roSplashGlow2{
        0%,100%{opacity:.34;transform:scale(1.06) translate(2%,1.5%);}
        50%{opacity:.72;transform:scale(.94) translate(-2%,-1.5%);}
      }
      /* The relay ring: one dot per relay the app opens (index.html's
         __roSplashRelay, fed by warmRelayConnections). A dot lights only when
         its relay has really connected — never on a timer, never on EOSE. */
      .ro-splash-ring{position:absolute;inset:0;opacity:0;transition:opacity .3s ease;}
      .ro-splash-waiting .ro-splash-ring{opacity:1;}
      .ro-splash-ring i{
        position:absolute;left:50%;top:50%;
        width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
        background:var(--ro-dot);
        transform:rotate(var(--a,0deg)) translateY(-66px);
        transition:background .25s ease,box-shadow .25s ease,transform .3s ease;
      }
      .ro-splash-ring i.on{background:var(--ro-dot-on);box-shadow:0 0 0 3px var(--ro-glow);animation:roSplashPop .42s cubic-bezier(.2,.9,.3,1.4);}
      @keyframes roSplashPop{
        0%{transform:rotate(var(--a,0deg)) translateY(-66px) scale(.4);}
        60%{transform:rotate(var(--a,0deg)) translateY(-66px) scale(1.5);}
        100%{transform:rotate(var(--a,0deg)) translateY(-66px) scale(1);}
      }
      .ro-splash-status,.ro-splash-retry-note{
        font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ro-note);
      }
      .ro-splash-status{
        position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);
        text-align:center;opacity:0;transition:opacity .3s ease;
      }
      .ro-splash-waiting .ro-splash-status:not(:empty){opacity:1;}
      .ro-splash-stuck .ro-splash-status:not(:empty){opacity:0;}
      /* Stuck-load reload escape hatch: hidden until #ro-splash gets .ro-splash-stuck */
      .ro-splash-retry{
        position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);left:0;right:0;
        display:flex;flex-direction:column;align-items:center;gap:12px;
        opacity:0;transform:translateY(6px);pointer-events:none;
        transition:opacity .3s ease,transform .3s ease;
      }
      #ro-splash.ro-splash-stuck .ro-splash-retry{opacity:1;transform:translateY(0);pointer-events:auto;}
      .ro-splash-retry-btn{
        appearance:none;border:1px solid var(--ro-ring);background:transparent;color:var(--ro-mark);
        font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;
        padding:10px 26px;min-height:44px;border-radius:999px;cursor:pointer;
        transition:background .2s ease,border-color .2s ease;
      }
      .ro-splash-retry-btn:active{background:var(--ro-glow);}
      /* Reduced motion: the mark stays still; dots still light, without the pop. */
      @media (prefers-reduced-motion: reduce){
        .ro-splash-waiting .ro-splash-glow,.ro-splash-waiting .ro-splash-glow-2{animation:none;}
        .ro-splash-waiting .ro-splash-trace{animation:none;opacity:0;}
        .ro-splash-ring i.on{animation:none;}
        #ro-splash{transition:opacity .2s ease;}
      }
    </style>
    <script>try{var t=localStorage.getItem('relay-outpost-theme');if(t==='light')document.documentElement.classList.add('ro-splash-light');else if(t==='black')document.documentElement.classList.add('ro-splash-black');}catch(e){}</script>
    <script>
      // The app stylesheet loads without blocking the first paint (built by
      // shared/non-blocking-css.ts); it calls __roCssDone when it's in, and the
      // splash stays up until then so nothing ever shows unstyled.
      window.__roCss=new Promise(function(r){window.__roCssDone=r});
      document.documentElement.classList.add('ro-booting');
    </script>

      <div class="ro-splash-status" id="ro-splash-status"></div>
      <div class="ro-splash-retry" id="ro-splash-retry">
        <div class="ro-splash-retry-note">Taking longer than usual</div>
        <button type="button" class="ro-splash-retry-btn" id="ro-splash-retry-btn">Reload</button>
      </div>
    </div>
    <script>
      // Splash teardown, the relay ring, and resilience.
      //  - Never longer than the real wait: the app's ready signal fades the
      //    splash at once. Only a load still running at 400 ms gets the moving
      //    mark (.ro-splash-waiting) — a fast launch cuts straight to the app.
      //  - window.__roSplashRelay(url, 'open' | 'up'): one dot per relay being
      //    opened (at most 8), lit only when that relay really connected.
      //  - If the app never signals ready (slow/failed bundle on a poor network),
      //    we DON'T remove the splash into a blank screen; we reveal a Reload
      //    escape hatch. Reload re-fetches a fresh index + chunks (network-first),
      //    which also self-heals a stale service-worker cache.
      (function(){
        var WAIT_MS = 400;  // below this, a launch is "instant": no brand beat
        var MAX_DOTS = 8;
        var el=document.getElementById('ro-splash');
        var ring=document.getElementById('ro-splash-ring');
        var status=document.getElementById('ro-splash-status');
        var dots={}, count=0, up=0;
        var live=function(){ return el && !el.dataset.hiding; };
        window.__roSplashRelay=function(url,state){
          if(!live()||!ring||!status)return;
          var d=dots[url];
          if(!d){
            if(count>=MAX_DOTS)return;
            d=dots[url]=document.createElement('i');
            ring.appendChild(d);
            count++;
            var all=ring.children;
            for(var i=0;i<all.length;i++){ all[i].style.setProperty('--a',(i*360/all.length)+'deg'); }
          }
          if(state==='up'&&!d.classList.contains('on')){ d.classList.add('on'); up++; }
          status.textContent=(up?'Connected ':'Connecting ')+up+' of '+count;
        };
        // The app opens its relays only once its JavaScript runs, which is also
        // when the splash lifts, so the splash knocks on the fast relays itself
        // from the first frame: a dot lights on a real socket open, then the
        // socket closes (it has done its job, and warmed DNS + TLS for the app's
        // own connection). Same list as FAST_RELAYS in lib/nostr.ts (pinned by
        // launch-splash.test.ts); relays you blocked are never dialled.
        var FAST=['wss://relay.damus.io','wss://relay.snort.social','wss://nostr.land','wss://relay.primal.net'];
        var socks=[];
        var norm=function(u){ u=String(u).trim().toLowerCase().replace(/^wss?:\/\//,'').replace(/\/+$/,''); return u; };
        var blocked={};
        try{ JSON.parse(localStorage.getItem('nostr_blocked_relays')||'[]').forEach(function(u){ blocked[norm(u)]=1; }); }catch(e){}
        if(typeof WebSocket==='function'){
          FAST.forEach(function(url){
            if(blocked[norm(url)])return;
            try{
              window.__roSplashRelay(url,'open');
              var ws=new WebSocket(url);
              socks.push(ws);
              ws.onopen=function(){ window.__roSplashRelay(url,'up'); try{ws.close();}catch(e){} };
              ws.onerror=function(){ try{ws.close();}catch(e){} };
            }catch(e){}
          });
        }
        window.__roHideSplash=function(){
          if(!live())return;
          socks.forEach(function(ws){ try{ws.close();}catch(e){} });
          el.dataset.hiding='1';
          el.classList.add('ro-splash-hide');
          var done=function(){ if(el&&el.parentNode){el.parentNode.removeChild(el);} document.documentElement.classList.remove('ro-booting'); };
          el.addEventListener('transitionend',done,{once:true});
          setTimeout(done,600); // guarantee removal even if transitionend is missed
        };
        setTimeout(function(){ if(live()){ el.classList.add('ro-splash-waiting'); } }, WAIT_MS);
        // Stuck-load: after ~9s with no "ready" signal, surface a reload button
        // in place — never vanish into a blank.
        setTimeout(function(){ if(live()){ el.classList.add('ro-splash-stuck'); } }, 9000);
        var btn=document.getElementById('ro-splash-retry-btn');
        if(btn){ btn.addEventListener('click', function(){ try{location.reload();}catch(e){} }); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
