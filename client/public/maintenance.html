<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='robots' content='noindex'>
<title>Relay Outpost · back in a moment</title>
<noscript><meta http-equiv='refresh' content='30'></noscript>
<style>
:root{--bg:#0a0c10;--card:#141820;--line:#262b35;--fg:#f3f5f8;--mute:#a3acba;--ember:#ff6a3d;--btn:#f3f5f8;--on:#0a0c10}
@media (prefers-color-scheme:light){:root{--bg:#f7f7f8;--card:#fff;--line:#e2e3e6;--fg:#0d0f12;--mute:#565d69;--ember:#ff5b2e;--btn:#0d0f12;--on:#fff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:16px/1.55 Geist,system-ui,sans-serif;text-align:center}
main{max-width:440px}
svg{width:54px;height:54px;animation:t .9s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.now{margin:22px 0 10px;font-size:14px;font-weight:500;color:var(--mute)}
h1{font-size:clamp(26px,6.6vw,34px);line-height:1.12;font-weight:600;letter-spacing:-.035em;margin:0 0 12px}
.lede{color:var(--mute);margin:0 auto 28px;max-width:36ch}
.safe{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:14px;color:var(--mute);margin-bottom:28px}
.safe b{display:block;color:var(--fg);font-weight:600}
.check{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
#status{margin:0;font-size:14px;color:var(--mute);min-width:17ch}
button{min-height:44px;padding:0 22px;border:0;border-radius:99px;background:var(--btn);color:var(--on);font:500 15px Geist,system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
@media (prefers-reduced-motion:reduce){svg{animation:none}}
</style>
</head>
<body>
<main>
<svg viewBox='0 0 100 100' role='img' aria-label='Relay, working'><path d='M78.98 42.24A30 30 0 1 1 57.76 21.02' fill='none' stroke='currentColor' stroke-width='9' stroke-linecap='round'/><circle cx='71.2' cy='28.8' r='6.5' fill='var(--ember)'/></svg>
<p class='now'>Updating</p>
<h1>We’re updating Relay Outpost</h1>
<p class='lede'>This usually takes under a minute. The page reloads on its own as soon as we’re back, so you can leave it open.</p>
<div class='safe'><b>Nothing is lost</b>Your posts, messages and follows live on Nostr relays, not on our servers.</div>
<div class='check'><p id='status' aria-live='polite'>Checking shortly</p><button id='retry' type='button'>Try again</button></div>
</main>
<script>
(function () {
  var el = document.getElementById('status'), waits = [5, 10, 15, 20, 30], n = 0, timer, busy;
  function tick(s) {
    if (s < 1) return check();
    el.textContent = 'Checking again in ' + s + 's';
    timer = setTimeout(tick, 1000, s - 1);
  }
  function check() {
    if (busy) return;
    busy = 1;
    clearTimeout(timer);
    el.textContent = 'Checking now…';
    fetch('/api/version', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw 0;
      el.textContent = 'We are back. Reloading…';
      location.reload();
    }).catch(function () {
      busy = 0;
      tick(waits[Math.min(n++, 4)]);
    });
  }
  document.getElementById('retry').onclick = function () { n = 0; check(); };
  tick(waits[n++]);
})();
</script>
</body>
</html>
