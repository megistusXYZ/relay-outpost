<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='robots' content='noindex'>
<title>Relay Outpost · back in a moment</title>
<noscript><meta http-equiv='refresh' content='30'></noscript>
<style>
:root{--bg:#0a090c;--card:#121014;--line:#2e2a33;--fg:#f5f5f5;--mute:#b8b8b8;--brand:#b38bf9;--ink:#16101d}
@media (prefers-color-scheme:light){:root{--bg:#f9f8fc;--card:#fff;--line:#dedbe4;--fg:#1d1726;--mute:#5a5669;--brand:#5e2db4;--ink:#fff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;box-sizing:border-box;background:radial-gradient(70% 50% at 50% 0,#7c3aed33,transparent 72%),var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif;text-align:center}
main{max-width:440px}
.mark{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;font:700 13px/1 Oxanium,system-ui;letter-spacing:.24em;text-transform:uppercase}
svg{width:20px;height:20px;color:var(--brand)}
.pill{margin:36px 0 14px;font-size:13px;font-weight:600;color:var(--brand)}
.dot{display:inline-block;vertical-align:middle;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--brand);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
h1{font-size:clamp(24px,6.4vw,30px);line-height:1.2;margin:0 0 12px}
.lede{color:var(--mute);margin:0 auto 28px;max-width:36ch}
.safe{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;color:var(--mute);margin-bottom:28px}
.safe b{display:block;color:var(--fg)}
.check{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
#status{margin:0;font-size:14px;color:var(--mute);min-width:17ch}
button{min-height:44px;padding:0 22px;border:0;border-radius:99px;background:var(--brand);color:var(--ink);font:600 15px system-ui;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
<div class='mark'><span>Relay</span><svg viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M5.5 7.8L2 4H7l6 6H8.5a3.5 3.5 0 0 0 0 7H10l3 3H8.5a6.5 6.5 0 0 1-3-12.2z'/><path d='M18.5 16.2L22 20H17l-6-6h4.5a3.5 3.5 0 0 0 0-7H14l-3-3h4.5a6.5 6.5 0 0 1 3 12.2z'/></svg><span>Outpost</span></div>
<p class='pill'><span class='dot' aria-hidden='true'></span>Updating</p>
<h1>We’re updating Relay Outpost</h1>
<p class='lede'>This usually takes under a minute. The page reloads on its own as soon as we’re back, so you can leave it open.</p>
<div class='safe'><b>Nothing is lost</b>Your posts, messages and follows live on Nostr relays, not on our servers.</div>
<div class='check'><p id='status' aria-live='polite'>Checking shortly</p><button id='retry' type='button'>Try again</button></div>
</main>
<script>
(function () {
  var el = document.getElementById('status'), waits = [5, 10, 15, 20, 30], n = 0, timer, busy;
  function tick(s) {
    if (s < 1) return check();
    el.textContent = 'Checking again in ' + s + 's';
    timer = setTimeout(tick, 1000, s - 1);
  }
  function check() {
    if (busy) return;
    busy = 1;
    clearTimeout(timer);
    el.textContent = 'Checking now…';
    fetch('/api/version', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw 0;
      el.textContent = 'We are back. Reloading…';
      location.reload();
    }).catch(function () {
      busy = 0;
      tick(waits[Math.min(n++, 4)]);
    });
  }
  document.getElementById('retry').onclick = function () { n = 0; check(); };
  tick(waits[n++]);
})();
</script>
</body>
</html>
